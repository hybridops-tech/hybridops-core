[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridops-core"
version = "0.1.7"
description = "HybridOps.Core runtime scaffold"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "cryptography>=41,<51",
  "jmespath>=1.0,<2",
  "netaddr>=0.8,<2",
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["hyops*"]

[tool.setuptools.package-data]
"hyops.assets.init.proxmox" = ["*.sh"]
"hyops.drivers.iac.terragrunt" = ["profiles/*.yml", "templates/*/*.tmpl"]
"hyops.drivers.config.ansible" = [
  "profiles/*.yml",
  "collections/**/*.yml",
  "collections/**/*.yaml",
  "collections/**/*.j2",
  "collections/**/*.json",
  "collections/**/*.cfg",
  "collections/**/*.ini",
  "collections/**/*.md",
  "collections/**/*.txt",
]
"hyops.drivers.images.packer" = ["profiles/*.yml", "README.md"]
"hyops.drivers.local.artifact" = ["profiles/*.yml"]
"hyops.state" = ["examples/*.yml"]

[project.scripts]
hyops = "hyops.cli:main"

[project.urls]
"Homepage" = "https://hybridops.tech"
"Documentation" = "https://docs.hybridops.tech"
"Bug Tracker" = "https://github.com/hybridops-tech/hybridops-core/issues"
"Repository" = "https://github.com/hybridops-tech/hybridops-core"
"Changelog" = "https://github.com/hybridops-tech/hybridops-core/blob/main/CHANGELOG"
