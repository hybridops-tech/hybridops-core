---
- name: Destroy platform/linux/containerlab-gui
  hosts: targets
  become: true
  gather_facts: false

  tasks:
    - name: Remove Containerlab GUI
      ansible.builtin.include_role:
        name: "{{ containerlab_gui_role_fqcn }}"
      vars:
        _containerlab_gui_action: absent

  post_tasks:
    - name: Write HyOps outputs
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        dest: "{{ hyops_outputs_file }}"
        mode: "0600"
        content: |
          {{ {
            'cap.lab.containerlab.gui': 'absent',
            'containerlab_gui_status': containerlab_gui_result.status
          } | to_json }}
