api_version: hybridops/v1
kind: BlueprintSpec

blueprint_ref: "linux/containerlab@v1"
mode: "hybrid"

metadata:
  title: "Local Linux Containerlab Lab"
  description: "Run a Containerlab topology on Ubuntu Linux or Ubuntu under WSL2."
  outcome: "A local Containerlab lab, browser interface and direct automation client material are ready."
  ready_message: "Local Containerlab lab ready"

policy:
  fail_fast: true
  evidence_required: true
  ipam_authority: "none"

access:
  type: "linux-host-http"
  host: "127.0.0.1"
  scheme: "https"
  remote_port: 3001
  path: "/"
  open_browser: true
  offer_destroy_on_close: false
  automation:
    discovery_mode: "containerlab-inspect"
    discovery_topology_path: "/var/lib/hybridops/containerlab/labs/${USER}/local-containerlab/lab.clab.yml"
    management_network_label: "clab"
    management_cidr: "172.20.20.0/24"
    management_gateway: "172.20.20.1"
    default_user: "admin"
    local_socks_port: 0

steps:
  - id: local_containerlab_runtime
    module_ref: "platform/linux/containerlab"
    state_instance: "local_containerlab_runtime"
    action: "deploy"
    phase: "bootstrap"
    with_deps: false
    retain_on_destroy: true
    skip_if_state_ok: false
    contracts:
      addressing_mode: "static"
    inputs:
      target_host: "127.0.0.1"
      local_execution: true
      target_user: "local"
      connectivity_check: false
      become: true
      become_user: "root"
      containerlab_version: "0.78.0"
      containerlab_install_docker: true
      containerlab_post_install_connectivity_wait_s: 90
      containerlab_operator_user: "${USER}"
      containerlab_package_checksum: ""
      # Enable for VM-based node kinds that require hardware acceleration.
      containerlab_require_kvm: false

  - id: local_containerlab_lab
    module_ref: "platform/linux/containerlab-lab"
    state_instance: "local_containerlab_lab"
    action: "deploy"
    phase: "operations"
    requires:
      - local_containerlab_runtime
    with_deps: false
    skip_if_state_ok: false
    contracts:
      addressing_mode: "static"
    inputs:
      target_host: "127.0.0.1"
      local_execution: true
      target_user: "local"
      connectivity_check: false
      become: true
      become_user: "root"
      # Use a Linux or WSL path containing lab.clab.yml.
      containerlab_lab_source_dir: ""
      containerlab_lab_topology_relpath: "lab.clab.yml"
      containerlab_lab_remote_dir: "/var/lib/hybridops/containerlab/labs/${USER}/local-containerlab"
      containerlab_lab_remote_owner: "${USER}"
      containerlab_lab_labdir_base: "/var/lib/hybridops/containerlab/labdirs"
      containerlab_lab_destroy_all: false
      containerlab_lab_required_images: []
      containerlab_lab_pull_missing_images: false
      containerlab_lab_local_image_archives: []
      # Set to an authorised IOL-XE source directory when required.
      containerlab_lab_local_image_dir: ""
      containerlab_lab_local_image_dir_authorised_use: false
      containerlab_lab_local_image_builds: []
      containerlab_lab_restore_latest: true
      containerlab_lab_restore_require_source_match: true

  - id: local_containerlab_gui
    module_ref: "platform/linux/containerlab-gui"
    state_instance: "local_containerlab_gui"
    action: "deploy"
    phase: "operations"
    requires:
      - local_containerlab_lab
    with_deps: false
    skip_if_state_ok: false
    contracts:
      addressing_mode: "static"
    inputs:
      target_host: "127.0.0.1"
      local_execution: true
      target_user: "local"
      connectivity_check: false
      become: true
      become_user: "root"
      containerlab_gui_operator_user: "${USER}"
      containerlab_gui_manage_operator_password: false
      containerlab_gui_labs_dir: "/var/lib/hybridops/containerlab/labs"
      containerlab_gui_state_dir: "/var/lib/hybridops/containerlab/gui"
      containerlab_gui_api_image: "ghcr.io/srl-labs/clab-api-server/clab-api-server:v0.6.0"
      containerlab_gui_web_image: "ghcr.io/srl-labs/containerlab-web:0.2.2"
      containerlab_gui_api_port: 8090
      containerlab_gui_web_port: 3001

  - id: local_containerlab_healthcheck
    module_ref: "platform/linux/containerlab-healthcheck"
    state_instance: "local_containerlab_healthcheck"
    action: "deploy"
    phase: "operations"
    requires:
      - local_containerlab_gui
    with_deps: false
    skip_if_state_ok: false
    contracts:
      addressing_mode: "static"
    inputs:
      target_host: "127.0.0.1"
      local_execution: true
      target_user: "local"
      connectivity_check: false
      become: true
      become_user: "root"
      containerlab_healthcheck_expected_version: "0.78.0"
      containerlab_healthcheck_require_kvm: false
      containerlab_healthcheck_topology_path: "/var/lib/hybridops/containerlab/labs/${USER}/local-containerlab/lab.clab.yml"
      containerlab_healthcheck_labdir_base: "/var/lib/hybridops/containerlab/labdirs"
      containerlab_healthcheck_require_deployed_lab: true

  - id: local_containerlab_recovery_guard
    module_ref: "platform/linux/containerlab-recovery"
    state_instance: "local_containerlab_recovery_guard"
    action: "deploy"
    phase: "operations"
    destroy_gate: true
    requires:
      - local_containerlab_healthcheck
      - local_containerlab_lab
    with_deps: false
    skip_if_state_ok: false
    contracts:
      addressing_mode: "static"
    inputs:
      target_host: "127.0.0.1"
      local_execution: true
      target_user: "local"
      connectivity_check: false
      become: true
      become_user: "root"
      containerlab_recovery_action: "arm"
      containerlab_recovery_mode: "rebuild"
      containerlab_recovery_source_root: "/var/lib/hybridops/containerlab/labs/${USER}/local-containerlab"
      containerlab_recovery_topology_relpath: "lab.clab.yml"
      containerlab_recovery_image_refs: []
      containerlab_recovery_labdir_base: "/var/lib/hybridops/containerlab/labdirs"
      containerlab_recovery_save_configs: true
      containerlab_recovery_save_configs_required: false
      containerlab_recovery_include_lab_dir: true
