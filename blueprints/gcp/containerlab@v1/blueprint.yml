api_version: hybridops/v1
kind: BlueprintSpec

blueprint_ref: "gcp/containerlab@v1"
mode: "hybrid"

metadata:
  title: "GCP Disposable Containerlab Lab"
  description: "Provision private high-resource Containerlab compute on demand and require a verified off-host recovery set before managed-host teardown."
  outcome: "A private Containerlab host runs the operator's unchanged topology, and HybridOps verifies off-host recovery state before the host can be removed."
  ready_message: "Containerlab cloud lab ready"

policy:
  fail_fast: true
  evidence_required: true
  ipam_authority: "none"

recoverable_secrets:
  - "CONTAINERLAB_GUI_PASSWORD"

access:
  type: "gcp-iap-ssh-forward"
  state_ref: "platform/gcp/platform-vm#gcp_containerlab_vm"
  scheme: "https"
  remote_port: 3001
  local_port: 0
  open_browser: true
  ssh_user: "opsadmin"
  ssh_key_file: "~/.ssh/id_ed25519"
  offer_destroy_on_close: true
  automation:
    discovery_mode: "containerlab-inspect"
    discovery_topology_path: "/var/lib/hybridops/containerlab/labs/opsadmin/gcp-containerlab/lab.clab.yml"
    management_network_label: "clab"
    management_cidr: "172.20.20.0/24"
    management_gateway: "172.20.20.1"
    default_user: "admin"
    local_socks_port: 0

steps:
  - id: gcp_containerlab_network
    module_ref: "platform/gcp/lab-network"
    execution_profile: "gcp-local@v1.0"
    state_instance: "gcp_containerlab_network"
    action: "deploy"
    phase: "bootstrap"
    with_deps: false
    skip_if_state_ok: true
    verify_state_on_skip: true
    contracts:
      addressing_mode: "static"
    inputs:
      name_prefix: "platform"
      context_id: "containerlab"
      subnetwork_cidr: "10.80.70.0/24"

  - id: gcp_containerlab_vm
    module_ref: "platform/gcp/platform-vm"
    execution_profile: "gcp-local@v1.0"
    state_instance: "gcp_containerlab_vm"
    action: "deploy"
    phase: "bootstrap"
    requires:
      - gcp_containerlab_network
    with_deps: true
    skip_if_state_ok: true
    verify_state_on_skip: true
    contracts:
      addressing_mode: "static"
    inputs:
      name_prefix: "platform"
      context_id: "containerlab"
      network_state_ref: "platform/gcp/lab-network#gcp_containerlab_network"
      subnetwork_output_key: "subnetwork_name"
      zone: ""
      zone_from_init_region: true
      machine_type: "n2-highmem-8"
      boot_disk_size_gb: 128
      boot_disk_type: "pd-standard"
      source_image_project: "ubuntu-os-cloud"
      source_image_family: "ubuntu-2204-lts"
      assign_public_ip: false
      enable_nested_virtualization: true
      ssh_username: "opsadmin"
      ssh_keys_from_init: true
      post_apply_ssh_readiness:
        enabled: true
        required: true
        target_user: "opsadmin"
        connectivity_wait_s: 90
      tags:
        - "platform"
        - "gcp"
        - "containerlab"
        - "lab"
        - "allow-iap-ssh"
      labels:
        role: "containerlab"
        workload: "network-lab"
        lifecycle: "disposable"
      vms:
        containerlab-01:
          role: "containerlab"

  - id: gcp_containerlab_runtime
    module_ref: "platform/linux/containerlab"
    state_instance: "gcp_containerlab_runtime"
    action: "deploy"
    phase: "operations"
    requires:
      - gcp_containerlab_vm
    with_deps: false
    skip_if_state_ok: false
    contracts:
      addressing_mode: "static"
    inputs:
      inventory_state_ref: "platform/gcp/platform-vm#gcp_containerlab_vm"
      inventory_vm_groups:
        targets:
          - "containerlab-01"
      target_user: "opsadmin"
      target_port: 22
      ssh_private_key_file: "~/.ssh/id_ed25519"
      ssh_access_mode: "gcp-iap"
      connectivity_wait_s: 90
      become: true
      become_user: "root"
      containerlab_version: "0.78.0"
      containerlab_install_docker: true
      containerlab_post_install_connectivity_wait_s: 90
      containerlab_operator_user: "opsadmin"
      # Empty means HybridOps verifies against the official pinned-release
      # checksums.txt manifest and records the actual downloaded SHA-256.
      containerlab_package_checksum: ""
      containerlab_require_kvm: true

  - id: gcp_containerlab_lab
    module_ref: "platform/linux/containerlab-lab"
    state_instance: "gcp_containerlab_lab"
    action: "deploy"
    phase: "operations"
    requires:
      - gcp_containerlab_runtime
    with_deps: false
    skip_if_state_ok: false
    contracts:
      addressing_mode: "static"
    inputs:
      inventory_state_ref: "platform/gcp/platform-vm#gcp_containerlab_vm"
      inventory_vm_groups:
        targets:
          - "containerlab-01"
      target_user: "opsadmin"
      target_port: 22
      ssh_private_key_file: "~/.ssh/id_ed25519"
      ssh_access_mode: "gcp-iap"
      connectivity_wait_s: 90
      become: true
      become_user: "root"
      # Set in a runtime overlay for a first deployment. On a later deployment,
      # a verified latest recovery bundle can supply the archived source tree.
      containerlab_lab_source_dir: ""
      containerlab_lab_topology_relpath: "lab.clab.yml"
      containerlab_lab_remote_dir: "/var/lib/hybridops/containerlab/labs/opsadmin/gcp-containerlab"
      containerlab_lab_remote_owner: "opsadmin"
      # Native Containerlab-generated clab-* runtime artifacts stay outside the
      # authoritative source tree so source preservation does not absorb them.
      containerlab_lab_labdir_base: "/var/lib/hybridops/containerlab/labdirs"
      containerlab_lab_destroy_all: true
      # Container images remain native references from the topology. List
      # required references here for an explicit availability check.
      containerlab_lab_required_images: []
      containerlab_lab_pull_missing_images: false
      # Load an authorised container image archive when its image is absent.
      # containerlab_lab_local_image_archives:
      #   - path: "/absolute/controller/path/cisco-iol.tar"
      #     image: "vrnetlab/cisco_iol:<version>"
      #     sha256: "<64 lowercase hex characters>"
      containerlab_lab_local_image_archives: []
      # Discover authorised IOL-XE sources from one local image folder.
      containerlab_lab_local_image_dir: ""
      containerlab_lab_local_image_dir_authorised_use: false
      # Build an authorised 64-bit Cisco IOL-XE source on the managed host.
      # Use this only for a non-standard layout that directory discovery cannot
      # resolve. The topology image must use the derived vrnetlab/cisco_iol tag.
      # containerlab_lab_local_image_builds:
      #   - kind: "cisco_iol"
      #     source: "/absolute/controller/path/cisco-iol.bin"
      #     version: "17.12.01"
      #     type: "l3"
      #     format: "binary"
      #     authorised_use: true
      #     sha256: "<64 lowercase hex characters>"
      containerlab_lab_local_image_builds: []
      containerlab_lab_restore_latest: true
      containerlab_lab_restore_require_source_match: true

  - id: gcp_containerlab_gui
    module_ref: "platform/linux/containerlab-gui"
    state_instance: "gcp_containerlab_gui"
    action: "deploy"
    phase: "operations"
    requires:
      - gcp_containerlab_lab
    with_deps: false
    skip_if_state_ok: false
    contracts:
      addressing_mode: "static"
    inputs:
      inventory_state_ref: "platform/gcp/platform-vm#gcp_containerlab_vm"
      inventory_vm_groups:
        targets:
          - "containerlab-01"
      target_user: "opsadmin"
      target_port: 22
      ssh_private_key_file: "~/.ssh/id_ed25519"
      ssh_access_mode: "gcp-iap"
      connectivity_wait_s: 90
      become: true
      become_user: "root"
      load_vault_env: true
      required_env:
        - "CONTAINERLAB_GUI_PASSWORD"
      containerlab_gui_operator_user: "opsadmin"
      containerlab_gui_manage_operator_password: true
      containerlab_gui_operator_password_env: "CONTAINERLAB_GUI_PASSWORD"
      containerlab_gui_labs_dir: "/var/lib/hybridops/containerlab/labs"
      containerlab_gui_state_dir: "/var/lib/hybridops/containerlab/gui"
      containerlab_gui_api_image: "ghcr.io/srl-labs/clab-api-server/clab-api-server:v0.6.0"
      containerlab_gui_web_image: "ghcr.io/srl-labs/containerlab-web:0.2.2"
      containerlab_gui_api_port: 8090
      containerlab_gui_web_port: 3001

  - id: gcp_containerlab_healthcheck
    module_ref: "platform/linux/containerlab-healthcheck"
    state_instance: "gcp_containerlab_healthcheck"
    action: "deploy"
    phase: "operations"
    requires:
      - gcp_containerlab_gui
    with_deps: false
    skip_if_state_ok: false
    contracts:
      addressing_mode: "static"
    inputs:
      inventory_state_ref: "platform/gcp/platform-vm#gcp_containerlab_vm"
      inventory_vm_groups:
        targets:
          - "containerlab-01"
      target_user: "opsadmin"
      target_port: 22
      ssh_private_key_file: "~/.ssh/id_ed25519"
      ssh_access_mode: "gcp-iap"
      connectivity_wait_s: 90
      become: true
      become_user: "root"
      containerlab_healthcheck_expected_version: "0.78.0"
      containerlab_healthcheck_require_kvm: true
      containerlab_healthcheck_topology_path: "/var/lib/hybridops/containerlab/labs/opsadmin/gcp-containerlab/lab.clab.yml"
      containerlab_healthcheck_labdir_base: "/var/lib/hybridops/containerlab/labdirs"
      containerlab_healthcheck_require_deployed_lab: true

  - id: gcp_containerlab_recovery_guard
    module_ref: "platform/linux/containerlab-recovery"
    state_instance: "gcp_containerlab_recovery_guard"
    action: "deploy"
    phase: "operations"
    destroy_gate: true
    requires:
      - gcp_containerlab_healthcheck
      - gcp_containerlab_lab
    with_deps: false
    skip_if_state_ok: false
    contracts:
      addressing_mode: "static"
    inputs:
      inventory_state_ref: "platform/gcp/platform-vm#gcp_containerlab_vm"
      inventory_vm_groups:
        targets:
          - "containerlab-01"
      target_user: "opsadmin"
      target_port: 22
      ssh_private_key_file: "~/.ssh/id_ed25519"
      ssh_access_mode: "gcp-iap"
      connectivity_wait_s: 90
      become: true
      become_user: "root"
      containerlab_recovery_action: "arm"
      # rebuild retains the declared source tree, supported config-save output
      # and the inspected native lab directory. snapshot additionally requests
      # supported vrnetlab snapshots.
      containerlab_recovery_mode: "rebuild"
      containerlab_recovery_source_root: "/var/lib/hybridops/containerlab/labs/opsadmin/gcp-containerlab"
      containerlab_recovery_topology_relpath: "lab.clab.yml"
      containerlab_recovery_image_refs: []
      containerlab_recovery_labdir_base: "/var/lib/hybridops/containerlab/labdirs"
      containerlab_recovery_save_configs: true
      containerlab_recovery_save_configs_required: false
      containerlab_recovery_include_lab_dir: true
