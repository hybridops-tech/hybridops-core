name: hyops-two-node-iol

topology:
  kinds:
    cisco_iol:
      image: ${HYOPS_CONTAINERLAB_IOL_L3_IMAGE}
  nodes:
    r1:
      kind: cisco_iol
      startup-config: r1.partial.cfg
    r2:
      kind: cisco_iol
      startup-config: r2.partial.cfg
  links:
    - endpoints:
        - "r1:Ethernet0/1"
        - "r2:Ethernet0/1"
